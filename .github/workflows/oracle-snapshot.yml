name: Oracle Snapshot (Daily)

on:
  schedule:
    # Primary: 00:05 Asia/Manila (UTC+8) — just after midnight, before any draw that day.
    - cron: '5 16 * * *'
    # Retry ticks, for the same dropped-schedule failure documented in
    # pcso-history-append.yml (2026-08-27: no scheduled run fired at all, so no
    # pick was logged for 2026-08-28). Both still land before the day's first
    # draw at 2PM Manila, and snapshot_oracle.mjs is idempotent per day unless
    # FORCE_OVERWRITE=1 — a retry after a successful run writes nothing.
    - cron: '45 18 * * *'  # 02:45 Asia/Manila
    - cron: '45 22 * * *'  # 06:45 Asia/Manila
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Oracle snapshot (computes today's pick via computeOracleAsOf, engine-frozen)
        run: node snapshot_oracle.mjs

      - name: Commit results (only if something changed)
        run: |
          git config user.name "Oracle Snapshot Bot"
          git config user.email "oracle-snapshot-bot@jomerpb.github.io"
          git add oracle-history.json
          git diff --staged --quiet || git commit -m "chore: log Oracle pick $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
