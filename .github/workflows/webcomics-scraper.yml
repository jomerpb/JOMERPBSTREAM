name: WebComics Scraper

# Manual only, which is the repo-wide convention — and unlike the three
# scheduled exceptions, this one earns it. Those exist because something
# user-visible goes stale on its own: the Manga tab's "Latest" feed IS
# mangafreak-latest.json, and pcso-history.json feeds a panel that disagreed
# with its neighbour when it ran behind.
#
# webcomics-index.json is not that. It is a slug index for a catalogue of ~3,100
# licensed originals that grows by a handful of titles a week, and nothing on
# the page reports its freshness. A title missing from it falls back to
# WebComics' search page — which is where ~97% of this app's titles land anyway,
# measured — so a stale index costs a direct link, not a broken tab. Dispatch it
# when the index feels behind.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No beautifulsoup4 here: the source is the site's own sitemap XML, and a
      # regex over <loc> rows is the whole parse. The scraper imports requests
      # only, and its test suite has no third-party import at all.
      - name: Install dependencies
        run: pip install requests

      - name: Run WebComics scraper
        run: python3 .github/scripts/scrape_webcomics.py

      # Rebase-and-retry like the MangaFreak job: this shares main with
      # pcso-history-append (15:00 UTC), oracle-snapshot (16:05 UTC) and an
      # hourly MangaFreak run, so even a manual dispatch can lose a push race.
      - name: Commit results
        run: |
          git config user.name "WebComics Bot"
          git config user.email "webcomics-bot@jomerpb.github.io"
          git add webcomics-index.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update WebComics slug index $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            # Explicit refspec rather than a bare `git push`: checkout@v4 can
            # leave HEAD detached, where a bare push has no upstream to resolve.
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push $i failed — rebasing onto origin/${GITHUB_REF_NAME} and retrying"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
