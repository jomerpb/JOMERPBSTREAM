name: PCSO History Append (Daily)

# Scheduled daily at 23:00 Asia/Manila, after that day's 9PM draws have been
# posted by the source site. This is a deliberate exception to the repo's
# manual-only workflow convention (see CLAUDE.md): pcso-history.json feeds the
# Oracle tab's "Look Up Past Result" panel, and while it was dispatch-only it
# routinely ran 2-4 days behind pcso-results.json (which powers the "Today's
# Results" widget), so the two panels disagreed about the same draw.
#
# Ordering note: this runs BEFORE oracle-snapshot.yml (05:16 UTC = 00:05
# Manila the next day), so that day's draws are already appended when the
# snapshot computes the next day's pick under the engine freeze.
#
# Still safe to run manually at any time — the script is append-only and
# never overwrites verified entries, so a scheduled run and a Fetch Live
# dispatch landing together cannot corrupt the file.
on:
  schedule:
    # Primary: 23:00 Asia/Manila (UTC+8), after that day's 9PM draws are posted.
    - cron: '0 15 * * *'
    # Two RETRY ticks. GitHub's cron is best-effort, not a guarantee: a
    # scheduled tick can be delayed or dropped outright under load, and on
    # 2026-08-27 BOTH this job and oracle-snapshot.yml were skipped entirely
    # (zero scheduled runs repo-wide that day, while a manual dispatch the same
    # evening ran fine — so it was the scheduler, not Actions being disabled or
    # out of quota). One dropped tick cost a full day of results in the Oracle
    # tab's "Look Up Past Result" panel, because nothing retried until the next
    # night's run 24h later.
    #
    # These cost ~25s each and almost always commit nothing: the script is
    # append-only and idempotent, and its missing_scheduled_dates() gapfill
    # backfills any date the primary tick missed. Verified against the live
    # sources at 06:49 Manila — the 02:40/06:40 window does recover the
    # previous day's draws, which is exactly the case that failed here.
    - cron: '40 18 * * *'  # 02:40 Asia/Manila — first retry
    - cron: '40 22 * * *'  # 06:40 Asia/Manila — last retry before the 2PM draw
  workflow_dispatch:

jobs:
  append-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Append new PCSO results (never overwrites existing data)
        run: python3 .github/scripts/append_pcso_history.py

      # Commits on EVERY run now, not only when a draw was added: the script
      # stamps a `checked` timestamp each time, and that stamp is what the
      # Oracle header's "Last Fetched" label reads. A run that found nothing
      # still has to reach the page, otherwise the label reports the last
      # manual fetch and looks days stale while the pipeline is fine.
      #
      # That makes this job share `main` with the hourly MangaFreak scraper
      # far more often, so the push rebases and retries the same way that one
      # does — a bare `git push` loses the race.
      - name: Commit results
        run: |
          git config user.name "PCSO History Bot"
          git config user.email "pcso-history-bot@jomerpb.github.io"
          git add pcso-history.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: sync PCSO history $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            # Explicit refspec rather than a bare `git push`: checkout@v4 on a
            # schedule can leave HEAD detached, where a bare push has no
            # upstream to resolve and fails outright.
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push $i failed — rebasing onto origin/${GITHUB_REF_NAME} and retrying"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
