name: Watch Providers

# The Streaming filter's option list. Scheduled for the same reason the other
# exceptions are: something user-visible goes stale on its own. Services arrive
# and leave a region, and their catalogues grow — a list built once would keep
# offering a checkbox for a service that no longer carries anything, and would
# never show one that has just launched.
#
# Weekly is generous for that: this moves on the timescale of licensing deals,
# not days. The whole run is ~75 TMDB calls and takes about 5 seconds, so it is
# cheap enough to dispatch by hand whenever a service launches locally.
on:
  schedule:
    - cron: '30 4 * * 1'   # Mondays 04:30 UTC = 12:30 Asia/Manila
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # stdlib only — urllib against TMDB's public endpoints.
      - name: Build watch-providers.json
        run: python3 .github/scripts/build_watch_providers.py

      # Rebase-and-retry like the other committing jobs: this shares main with
      # the PCSO, MangaFreak and IMDb workflows, so a bare push can lose a race.
      - name: Commit results
        run: |
          git config user.name "Watch Providers Bot"
          git config user.email "watch-providers-bot@jomerpb.github.io"
          git add watch-providers.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh streaming provider list $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push $i failed — rebasing onto origin/${GITHUB_REF_NAME} and retrying"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
